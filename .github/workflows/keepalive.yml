name: Supabase keep-alive

# Supabase pauses free projects after ~7 days with no database activity.
# Mondays and Thursdays leaves margin: a single skipped run cannot reach 7 days.
# Minute :23 avoids the on-the-hour window where GitHub's free tier drops
# scheduled jobs (learned the hard way on the investor-insight digest).
on:
  schedule:
    - cron: '23 7 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase to reset the inactivity timer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_URL:-}" ] || [ -z "${SUPABASE_ANON_KEY:-}" ]; then
            echo "::error::SUPABASE_URL / SUPABASE_ANON_KEY repo secrets are not set."
            exit 1
          fi
          # Must hit a table: an unauthenticated root ping does not count as
          # database activity, so it would not prevent the pause.
          code=$(curl -sS -o /tmp/resp.txt -w '%{http_code}' --max-time 30 \
            "${SUPABASE_URL}/rest/v1/profile?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")
          echo "HTTP $code"
          cat /tmp/resp.txt
          if [ "$code" != "200" ]; then
            echo "::error::Keep-alive query failed — the project may already be paused."
            exit 1
          fi
          echo "Keep-alive succeeded."
